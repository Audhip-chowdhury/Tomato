spring:
  application:
    name: tomato-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tomato_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: 7a8f9e2b4c6d1e3f5a7b9c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4
    expiration: 86400000

server:
  port: 8080
